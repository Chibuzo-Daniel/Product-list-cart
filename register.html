<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration-Page</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
      <img src="/images/food-logo-removebg.png" alt="" class="food-logo">
        <div class="container">
            <div class="register-text">Register</div>
            <div class="gap"><div class=" text-color">Full Name</div>
            <input type="text" class="input content-width gap fullname" placeholder="Enter your full name" ></div>
            <div class="gap"><div class="text-color">Username</div>
            <input type="text" class="input content-width gap username" placeholder="Enter your username" ></div>
            <div class="gap"><div class=" text-color">Phone Number</div>
            <input type="tel" class="input content-width gap phone-number" placeholder="Enter your phone number" ></div>
            <div class="Pas"><div class="text-color">Password</div>
            <input type="password"  class="input content-width password" placeholder="Enter Your Password"></div>
            <div class="Pas"><div class="text-color">Confirm Password</div>
            <input type="password" class="input content-width confirm-password" placeholder="Re-enter your password" ></div>
            
            <!-- <div class="hr content-width">.</div> -->

            <a href="" class="content-width">
                <button class="btn-register content-width">Register</button>
            </a>
               
             
            

            <div class="or text-color">Already have an account?</div>

            <a href="login.html" class="content-width">
                <button class="btn-sign content-width">Sign-in</button>
            </a>
                
            
           
            <!-- <img src="/images/hd-rm.food.png" alt=""> -->
        </div>
        <script src="R&L.js"></script>
</body>
</html>
